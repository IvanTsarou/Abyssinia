<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локация — Эфиопия</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50">
    <nav class="sticky top-0 z-50 bg-gradient-to-r from-[#078930] via-[#056b24] to-[#078930] shadow-lg">
        <div class="container mx-auto px-3 py-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-1 sm:gap-3">
                    <a href="overview.html" class="text-white/70 hover:text-white px-1.5 sm:px-2 py-1 text-xs sm:text-sm rounded hover:bg-white/10">🗺️ <span class="hidden sm:inline">Обзор</span></a>
                    <a href="index.html" class="text-white bg-white/20 px-1.5 sm:px-2 py-1 text-xs sm:text-sm rounded">🇪🇹 <span class="hidden sm:inline">Эфиопия</span></a>
                    <a href="uganda-map.html" class="text-white/70 hover:text-white px-1.5 sm:px-2 py-1 text-xs sm:text-sm rounded hover:bg-white/10">🇺🇬 <span class="hidden sm:inline">Уганда</span></a>
                    <a href="rwanda-map.html" class="text-white/70 hover:text-white px-1.5 sm:px-2 py-1 text-xs sm:text-sm rounded hover:bg-white/10">🇷🇼 <span class="hidden sm:inline">Руанда</span></a>
                    <a href="burundi-map.html" class="text-white/70 hover:text-white px-1.5 sm:px-2 py-1 text-xs sm:text-sm rounded hover:bg-white/10">🇧🇮 <span class="hidden sm:inline">Бурунди</span></a>
                </div>
            </div>
        </div>
    </nav>

    <header class="hero-ethiopia py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex flex-wrap items-center gap-3">
                <a href="journey.html" class="inline-flex items-center px-3 py-1.5 rounded-lg font-semibold text-white bg-white/20 hover:bg-white/30 transition text-sm">
                    <i class="fas fa-arrow-left mr-2"></i>Назад
                </a>
                <div class="flex-1 min-w-0">
                    <h1 class="text-lg sm:text-xl font-bold truncate" id="location-title">Загрузка…</h1>
                    <p class="text-xs text-white/80" id="location-type"></p>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-3 sm:px-4 py-4 md:py-6">
        <section class="mb-4 sm:mb-6">
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div id="photo-container" class="photo-placeholder h-48 sm:h-64 md:h-80 flex items-center justify-center text-gray-400">
                    <i class="fas fa-image text-4xl"></i>
                </div>
            </div>
        </section>

        <section class="mb-4 sm:mb-6">
            <div class="bg-white rounded-xl shadow-lg p-4 md:p-6">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-3"><i class="fas fa-info-circle mr-2 text-green-600"></i>Описание</h2>
                <p id="location-description" class="text-gray-700 text-sm leading-relaxed"></p>
            </div>
        </section>

        <section class="mb-4 sm:mb-6">
            <div class="bg-white rounded-xl shadow-lg p-4 md:p-6">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-3"><i class="fas fa-clipboard-list mr-2 text-yellow-500"></i>Практическая информация</h2>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="bg-gray-50 rounded-lg p-3">
                        <p class="text-gray-500 text-xs mb-1">Время на месте</p>
                        <p class="font-semibold text-gray-800" id="time-on-site">—</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-3">
                        <p class="text-gray-500 text-xs mb-1">День маршрута</p>
                        <p class="font-semibold text-gray-800" id="day-index">—</p>
                    </div>
                </div>
                <div id="highlights-container" class="mt-3"></div>
            </div>
        </section>

        <section class="mb-4 sm:mb-6">
            <div class="bg-white rounded-xl shadow-lg p-4 md:p-6">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-3"><i class="fas fa-map-marker-alt mr-2 text-red-500"></i>На карте</h2>
                <div id="loc-map"></div>
                <div class="mt-3 text-center">
                    <a id="google-maps-link" href="#" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium transition">
                        <i class="fas fa-external-link-alt"></i>
                        Открыть в Google Maps
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/ethiopia-data.js"></script>
    <script>
        let map;
        let currentLocation;
        const urlParams = new URLSearchParams(window.location.search);
        const locationId = parseInt(urlParams.get('id'));

        function loadLocation() {
            if (!ethiopiaLocations || !ethiopiaLocations.length) {
                document.getElementById('location-title').textContent = 'Ошибка загрузки';
                return;
            }
            currentLocation = ethiopiaLocations.find(l => l.id === locationId);
            if (!currentLocation) {
                document.getElementById('location-title').textContent = 'Локация не найдена';
                return;
            }

            document.title = currentLocation.name + ' — Эфиопия';
            document.getElementById('location-title').textContent = currentLocation.name;
            document.getElementById('location-type').textContent = currentLocation.type + (currentLocation.isUnesco ? ' · ЮНЕСКО' : '');
            document.getElementById('location-description').textContent = currentLocation.description;
            document.getElementById('time-on-site').textContent = currentLocation.timeOnSite || '—';
            document.getElementById('day-index').textContent = 'День ' + currentLocation.dayIndex;

            if (currentLocation.highlights && currentLocation.highlights.length) {
                document.getElementById('highlights-container').innerHTML = `
                    <p class="text-gray-500 text-xs mb-2">Что посмотреть:</p>
                    <div class="flex flex-wrap gap-2">
                        ${currentLocation.highlights.map(h => `<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs">${h}</span>`).join('')}
                    </div>
                `;
            }

            const lat = currentLocation.coordinates[1], lon = currentLocation.coordinates[0];
            document.getElementById('google-maps-link').href = `https://www.google.com/maps?q=${lat},${lon}`;

            loadMap();
        }

        function loadMap() {
            const lon = currentLocation.coordinates[0], lat = currentLocation.coordinates[1];
            map = L.map('loc-map', { scrollWheelZoom: false }).setView([lat, lon], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            const icon = L.divIcon({
                className: 'custom-marker',
                html: '<div style="background:#078930;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3)"><i class="fas fa-map-marker-alt" style="color:white;font-size:14px"></i></div>',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            L.marker([lat, lon], { icon }).addTo(map);
        }

        document.addEventListener('DOMContentLoaded', loadLocation);
    </script>
</body>
</html>
